<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Météo</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>

<body>
    <!-- box 1 -->
    <div class="boite1">
        <h1>Météo</h1>
        <h2>L'application pour consulter la météo !</h2>
        <p>Consultez la météo de n'importe quelle ville !</p>
    </div>

    <!-- box 2 -->
    <div class="boite2">

        <p>Entrez la ville de votre choix</p>

        <div class="saisie">
            <input class="zoneRecherche" id="entree">
            <button class="bouton" id="bouton" type="button" click="click">Découvrir le temps</button>
        </div>

        <p class="villeChoisie"></p>

        <div class="semaine">

            <div class="jourJ">
                <p id="jourJ"></p>
                <p class="temperatureJ"></p>
                <img class="iconeJ">
                <p class="tempsJ"></p>
            </div>

            <div class="jourPlus1">
                <p id="jourPlus1"></p>
                <p class="temperaturePlus1"></p>
                <img class="iconePlus1">
                <p class="tempsPlus1"></p>
            </div>

            <div class="jourPlus2">
                <p id="jourPlus2"></p>
                <p class="temperaturePlus2"></p>
                <img class="iconePlus2">
                <p class="tempsPlus2"></p>
            </div>

            <div class="jourPlus3">
                <p id="jourPlus3"></p>
                <p class="temperaturePlus3"></p>
                <img class="iconePlus3">
                <p class="tempsPlus3"></p>
            </div>

        </div>
    </div>
</body>

</html>
